:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:var(--bg);color:var(--text)}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:780px;margin:auto;padding:20px 16px 60px}h1{font-size:26px;margin:0}p{color:#a8b6cc}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.logo{display:flex;align-items:center;gap:10px}.logo img{width:38px}.panel,.repo{background:#141e30;border:1px solid #293750;border-radius:16px;padding:17px;margin-bottom:14px}label{display:block;font-weight:650;font-size:13px;margin:12px 0 7px}input,select,button{font:inherit}input:not([type=checkbox]),select{background:#0c1423;border:1px solid #3b4a62;color:#f2f6ff;border-radius:10px;padding:12px;width:100%;min-height:45px}input:focus,select:focus{outline:2px solid #66a8ff;outline-offset:1px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checks{display:flex;flex-wrap:wrap;gap:10px}.checks label{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;background:#24324a;padding:9px 11px;border-radius:10px;margin:0}.checks input{accent-color:#60a5fa}button{border:0;border-radius:11px;background:#3989f7;color:white;padding:12px 16px;font-weight:700;cursor:pointer;min-height:44px}button:disabled{opacity:.55;cursor:wait}.secondary{background:#263750}.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.actions button:first-child{flex:1}.muted,.meta{color:#aab8cb;font-size:13px}.meta{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}.repo h3{font-size:17px;margin:0;overflow-wrap:anywhere}.repo h3 a{color:#85baff;text-decoration:none}.repo p{margin:9px 0;overflow-wrap:anywhere}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.small{font-size:12px}.status{min-height:24px;margin:14px 0}.hide{display:none!important}code{overflow-wrap:anywhere;color:#b4d4ff}@media(max-width:420px){.grid{grid-template-columns:1fr}main{padding:15px 12px 50px}} 
:root{--bg:#000000;--text:#d8dce3;--panel:#090909;--border:#292929;--field:#050505;--field-border:#454545;--chip:#171717;--muted:#a6aab2;--link:#92baff;--secondary:#202020}
.panel,.repo{background:var(--panel);border-color:var(--border)}
input:not([type=checkbox]),select{background:var(--field);border-color:var(--field-border);color:var(--text)}
.checks label{background:var(--chip)}.muted,.meta{color:var(--muted)}.repo h3 a{color:var(--link)}.secondary{background:var(--secondary);color:var(--text)}
.lang-entry{display:flex;gap:8px;align-items:center}.lang-entry input{flex:1}.lang-entry button{flex:0 0 auto}.language-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.language-chips button{background:var(--chip);border:1px solid var(--field-border);color:var(--text);font-size:13px;min-height:36px;padding:7px 10px}

.repo-description{display:-webkit-box;-webkit-line-clamp:10;line-clamp:10;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;line-height:1.5}
.readme-toggle{margin-top:14px;background:var(--secondary);color:var(--text);border:1px solid var(--border);font-size:13px;display:inline-flex;align-items:center;gap:8px;padding:9px 12px;min-height:40px}
.readme-toggle .chevron{display:inline-block;transition:transform .15s ease}.readme-toggle[aria-expanded="true"] .chevron{transform:rotate(90deg)}
.readme-view{margin-top:12px;padding:15px;background:var(--field);border:1px solid var(--border);border-radius:12px;max-height:65vh;overflow:auto;overflow-wrap:anywhere;color:var(--text);font-size:14px;line-height:1.6}
.readme-view h1,.readme-view h2,.readme-view h3{font-size:1.1rem;margin:15px 0 8px;color:var(--text)}.readme-view p{color:var(--text);margin:8px 0;white-space:pre-wrap}.readme-view pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:10px;border-radius:8px;background:var(--panel)}.readme-view a{color:var(--link)}

.readme-view h1{font-size:1.45rem}.readme-view h2{font-size:1.25rem}.readme-view h3{font-size:1.12rem}
.readme-view h4,.readme-view h5,.readme-view h6{font-size:1rem;margin:12px 0 6px}
.readme-view p{white-space:normal}.readme-view pre{overflow-x:auto;white-space:pre;overflow-wrap:normal}
.readme-view pre code{white-space:pre;color:var(--text)}.readme-view code{background:var(--panel);padding:2px 4px;border-radius:4px}
.readme-view ul,.readme-view ol{padding-left:23px}.readme-view li{margin:5px 0}.readme-view blockquote{border-left:3px solid var(--field-border);padding-left:12px;margin:12px 0;color:var(--muted)}
.readme-view img{max-width:100%;height:auto}.readme-view table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%}.readme-view th,.readme-view td{border:1px solid var(--border);padding:6px 9px}.readme-view hr{border:0;border-top:1px solid var(--border)}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:14px}.tabs a{flex:1;text-align:center;padding:10px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:650;font-size:14px}.tabs a[aria-current=page]{background:var(--secondary);color:var(--text)}
.search-field{position:relative}.search-field input:not([type=checkbox]){padding-right:56px;min-height:50px}.search-field button{position:absolute;top:3px;right:3px;bottom:3px;width:46px;min-height:0;padding:0;display:flex;align-items:center;justify-content:center}.search-field svg{width:22px;height:22px}
.summary{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}.summary .language-chips{margin-top:0;flex:1 1 auto}.summary .language-chips:empty{display:none}#filterToggle{font-size:13px;min-height:36px;padding:7px 12px;margin-left:auto}
#form.collapsed{padding:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}#form.collapsed label[for=keywords]{display:none}#form.collapsed .search-field{flex:1 1 160px}#form.collapsed .summary,#form.collapsed .language-chips{display:contents}#form.collapsed #filterToggle{min-height:50px;margin:0}#form.collapsed #filterChips button{order:1}
.repo .top h3{min-width:0}.star{flex:0 0 auto;width:44px;min-height:44px;padding:0;background:transparent;color:var(--muted);font-size:24px;font-weight:400;line-height:1}.star[aria-pressed=true]{color:#f5c518}
.note{display:block;width:100%;margin-top:12px;background:var(--field);border:1px solid var(--field-border);border-radius:10px;color:var(--text);padding:10px 12px;font:inherit;resize:vertical}.note:focus{outline:2px solid #66a8ff;outline-offset:1px}

if(matchMedia('(hover:none) and (pointer:coarse)').matches&&!matchMedia('(display-mode: standalone)').matches&&navigator.standalone!==true){$('install').classList.remove('hide');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('installHint').classList.add('hide')});window.addEventListener('appinstalled',hideInstall);$('install').onclick=async()=>{if(installPrompt){const p=installPrompt;installPrompt=null;p.prompt();const{outcome}=await p.userChoice;if(outcome==='accepted')hideInstall();return}$('installHint').textContent=isIOS?'Tap the Share button, then “Add to Home Screen”.':'Open your browser menu and choose “Install app” or “Add to Home screen”.';$('installHint').classList.toggle('hide')}}
