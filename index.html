<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="description" content="Mobile GitHub repository discovery with advanced filters"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Repo Finder</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:var(--bg);color:var(--text)}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:780px;margin:auto;padding:20px 16px 60px}h1{font-size:26px;margin:0}p{color:#a8b6cc}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.logo{display:flex;align-items:center;gap:10px}.logo img{width:38px}.panel,.repo{background:#141e30;border:1px solid #293750;border-radius:16px;padding:17px;margin-bottom:14px}label{display:block;font-weight:650;font-size:13px;margin:12px 0 7px}input,select,button{font:inherit}input:not([type=checkbox]),select{background:#0c1423;border:1px solid #3b4a62;color:#f2f6ff;border-radius:10px;padding:12px;width:100%;min-height:45px}input:focus,select:focus{outline:2px solid #66a8ff;outline-offset:1px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checks{display:flex;flex-wrap:wrap;gap:10px}.checks label{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;background:#24324a;padding:9px 11px;border-radius:10px;margin:0}.checks input{accent-color:#60a5fa}button{border:0;border-radius:11px;background:#3989f7;color:white;padding:12px 16px;font-weight:700;cursor:pointer;min-height:44px}button:disabled{opacity:.55;cursor:wait}.secondary{background:#263750}.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.actions button:first-child{flex:1}.muted,.meta{color:#aab8cb;font-size:13px}.meta{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}.repo h3{font-size:17px;margin:0;overflow-wrap:anywhere}.repo h3 a{color:#85baff;text-decoration:none}.repo p{margin:9px 0;overflow-wrap:anywhere}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.small{font-size:12px}.status{min-height:24px;margin:14px 0}.hide{display:none!important}code{overflow-wrap:anywhere;color:#b4d4ff}#install{display:none}@media(max-width:420px){.grid{grid-template-columns:1fr}main{padding:15px 12px 50px}} 
:root{--bg:#0b1220;--text:#e9eef8;--panel:#141e30;--border:#293750;--field:#0c1423;--field-border:#3b4a62;--chip:#24324a;--muted:#aab8cb;--link:#85baff;--secondary:#263750}
:root[data-theme="oled"]{--bg:#000000;--text:#d8dce3;--panel:#090909;--border:#292929;--field:#050505;--field-border:#454545;--chip:#171717;--muted:#a6aab2;--link:#92baff;--secondary:#202020}
.panel,.repo{background:var(--panel);border-color:var(--border)}
input:not([type=checkbox]),select{background:var(--field);border-color:var(--field-border);color:var(--text)}
.checks label{background:var(--chip)}.muted,.meta{color:var(--muted)}.repo h3 a{color:var(--link)}.secondary{background:var(--secondary);color:var(--text)}
.lang-entry{display:flex;gap:8px;align-items:center}.lang-entry input{flex:1}.lang-entry button{flex:0 0 auto}.language-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.language-chips button{background:var(--chip);border:1px solid var(--field-border);color:var(--text);font-size:13px;min-height:36px;padding:7px 10px}.theme-switch{font-size:13px;white-space:nowrap}.theme-switch select{min-height:38px;padding:7px;width:auto}
</style></head><body><main><header><div class="logo"><img src="icon.svg" alt=""><div><h1>Repo Finder</h1><div class="muted">GitHub advanced search</div></div></div><div style="display:flex;gap:8px;align-items:center"><label class="theme-switch" for="theme">Theme <select id="theme" aria-label="Appearance"><option value="dark">Dark</option><option value="oled">OLED black</option></select></label><button id="install" class="secondary">Install</button></div></header>
<form id="form" class="panel"><label for="keywords">Keywords</label><input id="keywords" placeholder="e.g. GTK4 package manager" autocomplete="off"><label>Search keywords in</label><div class="checks"><label><input type="checkbox" name="scope" value="name" checked> Name</label><label><input type="checkbox" name="scope" value="description" checked> Description</label><label><input type="checkbox" name="scope" value="readme" checked> README</label></div><div class="grid"><div><label for="language">Languages (match any)</label><div class="lang-entry"><input id="language" list="langs" placeholder="Add a language" autocomplete="off"><button type="button" id="addLanguage" class="secondary">Add</button></div><div id="languageChips" class="language-chips" aria-live="polite"></div><datalist id="langs"><option>C</option><option>C++</option><option>Rust</option><option>Python</option><option>Go</option><option>JavaScript</option><option>TypeScript</option><option>Java</option><option>Kotlin</option><option>Shell</option><option>Zig</option><option>Lua</option><option>Swift</option></datalist></div><div><label for="sort">Sort</label><select id="sort"><option value="best">Best match</option><option value="stars">Most stars</option><option value="forks">Most forks</option><option value="updated">Recently updated</option></select></div></div><div class="grid"><div><label for="minStars">Minimum stars</label><input type="number" min="0" id="minStars" placeholder="0"></div><div><label for="maxStars">Maximum stars</label><input type="number" min="0" id="maxStars" placeholder="No maximum"></div></div><div class="grid"><div><label for="pushed">Last pushed</label><select id="pushed"><option value="">Any time</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="90">Last 90 days</option><option value="365">Last year</option><option value="custom">Since specific date</option></select></div><div id="dateWrap" class="hide"><label for="since">Pushed since</label><input id="since" type="date"></div></div><label class="toggle"><input type="checkbox" id="includeForks"> Include forked repositories in results</label><div class="actions"><button type="submit" id="search">Search repositories</button><button type="button" id="save" class="secondary">Save search</button></div><p class="small muted">Public repositories only. Searches use GitHub's API; anonymous requests have rate limits.</p></form>
<div class="panel"><div class="top"><strong>Saved searches</strong><button id="clear" type="button" class="secondary small">Clear</button></div><select id="saved"><option value="">Select a saved search…</option></select></div><div id="status" class="status" role="status" aria-live="polite"></div><div id="results"></div><div id="scrollSentinel" aria-hidden="true" style="height:1px"></div><div class="actions"><button id="more" class="secondary hide">Load more</button><button id="github" class="secondary hide">Open search on GitHub ↗</button></div></main><script>
const $=id=>document.getElementById(id),ids=['keywords','sort','minStars','maxStars','pushed','since'];let selectedLanguages=[];let current='',currentSort='best',page=1,total=0,busy=false,hasMore=false,requestId=0,controller=null,installPrompt=null;
function formState(){return Object.fromEntries([...ids.map(id=>[id,$(id).value]),['scope',[...document.querySelectorAll('input[name=scope]:checked')].map(x=>x.value)],['includeForks',$('includeForks').checked],['languages',selectedLanguages.slice()]])}
function restore(s){selectedLanguages=Array.isArray(s.languages)?s.languages.slice():s.language?[s.language]:[];renderLanguages();$('language').value='';ids.forEach(id=>$(id).value=s[id]||'');document.querySelectorAll('input[name=scope]').forEach(x=>x.checked=(s.scope||[]).includes(x.value));$('dateWrap').classList.toggle('hide',s.pushed!=='custom');$('includeForks').checked=!!s.includeForks}
function query(){const s=formState(),q=[];if(s.keywords.trim()){q.push(s.keywords.trim());if(s.scope.length)q.push('in:'+s.scope.join(','))}if(s.includeForks)q.push('fork:true');for(const lang of s.languages)q.push('language:"'+lang.replace(/"/g,'')+'"');if(s.minStars||s.maxStars)q.push('stars:'+(s.minStars||'0')+'..'+(s.maxStars||'*'));if(s.pushed){let d=s.pushed==='custom'?s.since:new Date(Date.now()-Number(s.pushed)*86400000).toISOString().slice(0,10);if(d)q.push('pushed:>='+d)}return q.join(' ')}
function url(){const p=new URLSearchParams({q:current||'stars:>=0',type:'repositories'});if(currentSort!=='best'){p.set('s',currentSort);p.set('o','desc')}return 'https://github.com/search?'+p}
function setStatus(t){$('status').textContent=t}
function repoCard(r){const card=document.createElement('article');card.className='repo';const h=document.createElement('h3'),a=document.createElement('a');a.href=r.html_url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=r.full_name;h.append(a);const desc=document.createElement('p');desc.textContent=r.description||'No description';const meta=document.createElement('div');meta.className='meta';for(const val of ['★ '+Number(r.stargazers_count).toLocaleString(),'⑂ '+Number(r.forks_count).toLocaleString()+' forks',r.language||'Unknown language','Pushed '+new Date(r.pushed_at).toLocaleDateString()]){const span=document.createElement('span');span.textContent=val;meta.append(span)}card.append(h,desc,meta);return card}
const observer=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)&&hasMore&&!busy)search(false)},{rootMargin:'350px 0px'});
observer.observe($('scrollSentinel'));
async function search(reset=true){
 if(reset){
  requestId++;if(controller)controller.abort();busy=false;
  const q=query();if(!q){hasMore=false;$('results').replaceChildren();$('more').classList.add('hide');$('github').classList.add('hide');setStatus('Enter a keyword or choose at least one filter.');return}
  current=q;currentSort=$('sort').value;page=1;total=0;hasMore=true;$('results').replaceChildren();
 }
 if(busy||!hasMore)return;
 const id=requestId;controller=new AbortController();busy=true;
 $('search').disabled=true;$('more').disabled=true;$('github').classList.remove('hide');$('more').classList.add('hide');
 setStatus(page===1?'Searching…':'Loading more repositories…');
 try{
  const p=new URLSearchParams({q:current,per_page:'30',page:String(page)});
  if(currentSort!=='best'){p.set('sort',currentSort);p.set('order','desc')}
  const response=await fetch('https://api.github.com/search/repositories?'+p,{headers:{Accept:'application/vnd.github+json'},signal:controller.signal});
  const data=await response.json();if(id!==requestId)return;
  if(!response.ok)throw Error(response.status===403||response.status===429?'GitHub API rate limit reached. Try again later or open the search on GitHub.':data.message||'Search failed');
  total=data.total_count||0;const items=data.items||[];
  for(const r of items)$('results').append(repoCard(r));
  const shown=$('results').children.length;
  hasMore=items.length>0&&shown<Math.min(total,1000);
  setStatus(`${shown.toLocaleString()} of ${total.toLocaleString()} matching repositories${total>1000?' (GitHub API provides at most 1,000 results per query)':''}${data.incomplete_results?' (GitHub reports incomplete results)':''}`);
  page++;
 }catch(e){if(id!==requestId||e.name==='AbortError')return;hasMore=false;setStatus('Error: '+e.message)}
 finally{if(id===requestId){busy=false;$('search').disabled=false;$('more').disabled=false;$('more').classList.toggle('hide',!hasMore)}}
}
function renderLanguages(){const root=$('languageChips');root.replaceChildren();selectedLanguages.forEach((lang,i)=>{const b=document.createElement('button');b.type='button';b.textContent=lang+' ×';b.setAttribute('aria-label','Remove '+lang);b.onclick=()=>{selectedLanguages.splice(i,1);renderLanguages()};root.append(b)})}
function addLanguage(){const val=$('language').value.trim();if(val&&!selectedLanguages.some(x=>x.toLowerCase()===val.toLowerCase()))selectedLanguages.push(val);$('language').value='';renderLanguages()}
$('addLanguage').onclick=addLanguage;$('language').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addLanguage()}});
const themeKey='repo-finder-theme';function setTheme(v){const t=v==='oled'?'oled':'dark';document.documentElement.dataset.theme=t;$('theme').value=t;document.querySelector('meta[name=theme-color]').content=t==='oled'?'#000000':'#101827';localStorage.setItem(themeKey,t)}
$('theme').onchange=e=>setTheme(e.target.value);setTheme(localStorage.getItem(themeKey)||'dark');
function savedItems(){try{return JSON.parse(localStorage.getItem('repo-finder-saved')||'[]')}catch{return []}}
function refreshSaved(){const items=savedItems();$('saved').replaceChildren(new Option('Select a saved search…',''));items.forEach((s,i)=>$('saved').add(new Option(s.label,String(i))))}
$('form').addEventListener('submit',e=>{e.preventDefault();if($('language').value.trim())addLanguage();search()});$('pushed').addEventListener('change',()=> $('dateWrap').classList.toggle('hide',$('pushed').value!=='custom'));$('more').onclick=()=>search(false);$('github').onclick=()=>window.open(url(),'_blank','noopener');$('save').onclick=()=>{const s=formState(),label=query();if(!label){setStatus('Set at least one filter before saving.');return}const items=savedItems();items.unshift({label,state:s});localStorage.setItem('repo-finder-saved',JSON.stringify(items.slice(0,30)));refreshSaved();setStatus('Search saved on this device.')};$('saved').onchange=()=>{const s=savedItems()[Number($('saved').value)];if(s){restore(s.state);search()}};$('clear').onclick=()=>{localStorage.removeItem('repo-finder-saved');refreshSaved();setStatus('Saved searches cleared.')};refreshSaved();window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('install').style.display='block'});$('install').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('install').style.display='none'}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
